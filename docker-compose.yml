services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dmers
      POSTGRES_USER: dmers
      POSTGRES_PASSWORD: change-me-before-deployment
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  postgres_data:
